  <section class="qapanel" id="qaPanel">
    <div class="qainput">
      <input id="qaInput" type="text" placeholder="问点什么，比如：宝塔山有多高？" maxlength="120">
      <button id="qaSend" class="btn-primary">提问</button>
    </div>
    <div class="modes" id="qaModes">
      <button class="mode on" data-mode="fact">史实</button>
      <button class="mode" data-mode="research">讲解词</button>
      <button class="mode" data-mode="moment">朋友圈</button>
    </div>
    <div id="qaAnswer" class="qaanswer"></div>
  </section>
