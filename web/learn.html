<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C1F28">
<title>红迹·延安 · 智能线路</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="learn-wrap" id="learnWrap">
  <header class="top learn-top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-name">红迹·延安</span>
        <span class="brand-sub" id="siteName">延小讲 · 陪你走延安</span>
      </div>
      <a class="ghost-btn" href="/">去问答</a>
    </div>
    <div class="progress-line">
      <div class="progress-bar"><i id="progFill" style="width:0%"></i></div>
      <span class="progress-txt" id="progTxt">0/6</span>
    </div>
  </header>

  <main class="learn-body">
    <!-- 一、对话式开场 -->
    <section id="stepChat" class="step">
      <div class="chat" id="chatLog"></div>
      <div class="chat-opts" id="chatOpts"></div>
      <div class="chat-input hidden" id="chatInputBox">
        <input id="chatInput" type="text" placeholder="比如：想带孩子看南泥湾，半天时间" maxlength="60">
        <button class="chat-send" id="chatSend">发送</button>
      </div>
    </section>

    <!-- 二、任务 + 主题线路 -->
    <section id="stepPlan" class="step hidden">
      <div class="plan-head">
        <span class="pill" id="planLabel"></span>
        <h2 class="step-title" id="planTitle"></h2>
        <p class="step-sub" id="planIntro"></p>
      </div>

      <div class="card task-brief">
        <div class="brief-title">你的任务</div>
        <div id="taskSummary"></div>
      </div>

      <div class="gallery" id="gallery"></div>

      <div class="web-brief hidden" id="webBrief"></div>

      <div class="route-title">主题线路 <span class="muted" id="routeCount"></span></div>
      <div class="route" id="routeList"></div>

      <div class="refine">
        <label for="refineNote">还想加点什么要求？（比如「多安排自然风光」「不要爬山」「只要免费的」）</label>
        <div class="refine-row">
          <input id="refineNote" type="text" maxlength="60" placeholder="补充一句，我按新要求重排">
          <button class="chat-send" id="refineBtn">重排</button>
        </div>
        <div class="refine-tags">
          <button class="tag" data-tag="多安排自然风光">多安排自然风光</button>
          <button class="tag" data-tag="不要爬山">不要爬山</button>
          <button class="tag" data-tag="只要免费的点位">只要免费</button>
          <button class="tag" data-tag="多留时间给纪念馆">多留纪念馆</button>
        </div>
      </div>

      <button class="btn-primary" id="startRoute">从第一个点位开始</button>
      <button class="btn ghost" id="reChat">重新说说需求</button>
    </section>

    <!-- 三、点位讲解 -->
    <section id="stepIntro" class="step hidden">
      <div class="site-head"><span class="site-no" id="introNo">01</span>
        <div><h2 class="step-title" id="introName"></h2><div class="muted" id="introLevel"></div></div></div>
      <div class="card intro-card" id="introText"></div>
      <button class="btn-primary" id="toTask2">领取本点位任务</button>
      <button class="btn ghost" id="backPlan">返回线路</button>
    </section>

    <!-- 四、任务 -->
    <section id="stepTask" class="step hidden">
      <div class="task-head"><span class="pill" id="taskKind"></span><span class="muted" id="taskHint"></span></div>
      <div class="card script-card hidden" id="partyScript"></div>
      <div class="card" id="questionCard"></div>
      <div id="textAreaBox" class="hidden">
        <textarea id="textAns" rows="5" placeholder="写下你在展板上看到的细节、年份或数字……"></textarea>
        <label class="upload hidden">上传现场照片
          <input type="file" id="imgFile" accept="image/*" capture="environment">
        </label>
        <div class="muted" id="imgName"></div>
      </div>
      <button class="btn-primary" id="submitBtn">提交</button>
      <div class="err" id="taskErr"></div>
    </section>

    <!-- 五、反馈 -->
    <section id="stepFeedback" class="step hidden">
      <h2 class="step-title" id="fbTitle"></h2>
      <div class="card" id="fbBody"></div>
      <button class="btn-primary" id="retryBtn">再试一次</button>
      <button class="btn ghost" id="continueBtn">下一个点位</button>
      <button class="btn ghost" id="cardBtn">生成本进度纪念卡</button>
    </section>

    <!-- 六、完成 -->
    <section id="stepFinish" class="step hidden">
      <div class="finish-mark">✓</div>
      <h2 class="step-title">线路全部完成</h2>
      <p class="step-sub" id="finishSub"></p>
      <div class="stat-grid" id="finishStats"></div>
      <button class="btn-primary" id="finalCardBtn">生成全线纪念卡</button>
    </section>
  </main>
</div>

<div class="sheet-mask hidden" id="memMask">
  <div class="sheet card-sheet">
    <div class="sheet-grab"></div>
    <div class="mem-name">
      <label for="memName">署名（会印在卡片上）</label>
      <input id="memName" type="text" maxlength="12" placeholder="填你的名字或昵称">
    </div>
    <canvas id="memCanvas" width="1080" height="1440"></canvas>
    <div class="card-actions">
      <button class="btn" id="memSave">保存图片</button>
      <button class="btn ghost" id="memClose">关闭</button>
    </div>
  </div>
</div>

<div class="zoom-mask hidden" id="zoomMask">
  <button class="zoom-close" id="zoomClose">✕ 关闭</button>
  <img id="zoomImg" alt="">
  <div class="zoom-cap" id="zoomCap"></div>
</div>

<div class="toast" id="toast"></div>
<script src="images.js"></script>
<script src="learn.js"></script>
</body>
</html>
