<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C1F28">
<title>红迹·延安 · AI 讲解员延小讲</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-name">红迹·延安</span>
        <span class="brand-sub">AI 讲解员 · 延小讲</span>
      </div>
      <button class="icon-btn" id="aboutBtn" aria-label="关于">?</button>
    </div>
    <div class="meta" id="kbMeta">知识库载入中…</div>
    <div class="modes" id="modes" role="tablist">
      <button class="mode on" data-mode="fact">史实问答</button>
      <button class="mode" data-mode="research">研学讲解词</button>
      <button class="mode" data-mode="moment">一句话</button>
    </div>
  </header>

  <main class="chat" id="chat">
    <section class="intro" id="intro">
      <h1>在延安，问一句有出处的话</h1>
      <p>我只答知识库里的 50 条史实，每条都标来源；没有的，我会直说“需要查证”。</p>
      <div class="chips" id="chips"></div>
    </section>
  </main>

  <footer class="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="问点什么，比如：宝塔山为什么是延安的象征？"></textarea>
      <button class="send" id="sendBtn">发送</button>
    </div>
    <div class="hint">只讲延安红色文旅 · 不猜数字 · 不给实时信息</div>
  </footer>
</div>

<!-- 来源详情 -->
<div class="sheet-mask hidden" id="srcMask">
  <div class="sheet" id="srcSheet">
    <div class="sheet-grab"></div>
    <h3 id="srcTitle">来源</h3>
    <div id="srcBody"></div>
    <button class="btn ghost" id="srcClose">关闭</button>
  </div>
</div>

<!-- 问答卡 -->
<div class="sheet-mask hidden" id="cardMask">
  <div class="sheet card-sheet">
    <div class="sheet-grab"></div>
    <canvas id="cardCanvas" width="1080" height="1440"></canvas>
    <div class="card-actions">
      <button class="btn" id="dlBtn">保存图片</button>
      <button class="btn ghost" id="copyBtn">复制文案</button>
      <button class="btn ghost" id="cardClose">关闭</button>
    </div>
    <div class="card-tip">手机上也可长按图片保存</div>
  </div>
</div>

<!-- 关于 -->
<div class="sheet-mask hidden" id="aboutMask">
  <div class="sheet">
    <div class="sheet-grab"></div>
    <h3>关于这个讲解员</h3>
    <p class="about-p">红迹·延安是一个只讲延安红色文旅的问答讲解员。它的全部知识来自 50 条带来源的问答，
      每条回答末尾的 <b>[Sxx]</b> 可以点开，直达政府网、部委或央媒原文。</p>
    <p class="about-p">它不猜：知识库没有的说“需要查证”；天气、客流、余票这类实时信息一律给官方渠道；
      遇到两种公开口径（如馆藏量），两种都列，不合并、不平均。</p>
    <div class="about-stat" id="aboutStat"></div>
    <button class="btn ghost" id="aboutClose">知道了</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="kb.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
